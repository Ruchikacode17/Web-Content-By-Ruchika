
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fade Functions</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js"></script>

</head>

<style>

    *{
        margin: 0%;
        padding: 0%;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body{
        background: linear-gradient(135deg, #15110f, #5c4334);
        text-align: center;
        padding: 40px;
        background-repeat:no-repeat;
        background-size:cover;
        background-attachment: fixed;
    }


    h1{
        color: white;
        margin-bottom: 20px;
        font-size: 30px;
    }

    .container{
        width: 80%;
        max-width: 500px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0px 0px 15px gray;
    }

    img{
        width: 100%;
        height: 350px;
        object-fit: cover;
        border-radius: 10px;
        margin: 20px 0px;
    }

    button{
        padding: 12px 20px;
        margin: 10px;
        border: none;
        border-radius: 7px;
        cursor: pointer;
        color: white;
        font-size: 18px;
    }

    button:hover{
        opacity: 0.8;
    }

    #inBtn,#outBtn,#toBtn{
        background: linear-gradient(130deg,#230e00,rgba(184, 23, 56, 0.671));
    }

    footer{
        
        color: white;
        margin-top: 30px;
        font-size: 20px;
    }

    @media(max-width:600px){

        .container{
            width: 95%;
        }

        img{
            height:250px;
        }

        button{
            width:100%;
        }
    }

</style>

<body>
    <h1>jQuery Fade Functions</h1>
    <div class="container">
        <img id="photo"
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR0h6_IMeRoWjYLe_Kj8XGIkB3-MA_H8r3nDDr-PGBCNANYcPDNWIrFj-UM&s=10" alt="Horse">
        <br>
       <button id="inBtn">Fade In</button>
       <button id="outBtn">Fade Out</button>
       <button id="toBtn">Fade to 25%</button>
      
    </div>

    <script>
        $(document).ready(function(){

          $("#inBtn").click(function(){
            $("#photo").fadeIn(1000);
            $("#photo").css("opacity","1");
          })  

          $("#outBtn").click(function(){
            $("#photo").fadeOut(1000);
          })

          $("#toBtn").click(function(){
            $("#photo").fadeTo(1000,0.3);
          })

        })


    </script>

</body>

<footer>
    © 2026 | JQuery Introduction by Ruchika.
</footer>


</html>
