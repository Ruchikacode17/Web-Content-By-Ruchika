
<!DOCTYPE html>
<html>
<head>
    <title>jQuery Fade Functions</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body{
            font-family:Arial;
            text-align:center;
             background-color: #b096ba;
        }

        
    header
{
font-size:30px;
font-family: sans-serif;
background:#403D88;
color:white;
text-align:center;
box-sizing:border-box;
padding:20px;
box-shadow:5px 5px 5px gray;
width:55%;
margin:auto;
margin-bottom:50px;
margin-top:20px;
border-radius: 3px;

}
button{
        padding: 3px 20px;
        margin: 3px;
        font-size: 20px;
        color: rgb(0, 0, 0);
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: 0.50s;
        border:2px solid black;
        
        
    }
         button:hover{
        transform: scale(1.0);
        background: rgb(255, 193, 193);
    }


#p1{
    width: 250px;
    margin-top: 30px;
    border-radius: 10px;
    box-shadow: 3px 5px 3px gray;
}

footer{
    background:#403D88;
    color:white;
    text-align:center;
    padding:20px;
    margin-top: 25px;
}
    </style>

    <header>
FADE FUNCTIONS (jQuery)
</header>  

</head>

<body>

<button id="fadein">Fade In</button>
<button id="fadeout">Fade Out</button>
<button id="fadeto">Opacity (20%)</button>

 <div class="container">

 </div>

      <img id="p1"
        src="https://i.pinimg.com/originals/66/8e/07/668e076b9ac3b3bac103f4cd33cfad00.png">

<script>
$(document).ready(function(){


    // Fade In
    $("#fadein").click(function(){
        $("#p1").fadeIn(1000);
    });

    // Fade Out
    $("#fadeout").click(function(){
        $("#p1").fadeOut(1000);
    });

    // Fade To
    $("#fadeto").click(function(){
        $("#p1").fadeTo(1000,0.5);
    });

});
</script>



        <footer>
        <div id="footer"> © 2026 | JQuery Content by Ruchika. </div>

    </footer>

</body>
</html>
